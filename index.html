<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance System</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .panel {
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            width: 100%;
        }

        .btn-logout {
            background: #95a5a6;
            color: white;
            width: 100%;
            padding: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            background: #ff6b6b;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        .hidden {
            display: none;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            background: #d4edda;
            color: #155724;
        }

        .status.show {
            display: block;
        }

        .center {
            text-align: center;
        }

        .clock-btn {
            padding: 20px 50px;
            font-size: 18px;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .clock-in {
            background: #28a745;
        }

        .clock-out {
            background: #dc3545;
        }

        .sync-indicator {
            padding: 10px;
            background: #e7f3ff;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #333;
        }

        .list-empty {
            color: #999;
            padding: 20px;
            text-align: center;
        }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .panel {
                padding: 20px;
            }

            .header {
                margin-bottom: 20px;
                padding-bottom: 15px;
            }

            .header h1 {
                font-size: 22px;
                margin-bottom: 8px;
            }

            .form-group input, .form-group select {
                padding: 10px 12px;
                font-size: 16px;
            }

            .btn-primary, .btn-danger {
                padding: 12px 20px;
                font-size: 14px;
            }

            .clock-btn {
                padding: 15px 40px;
                font-size: 16px;
                max-width: 90%;
            }

            .item {
                padding: 12px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .btn-small {
                padding: 6px 10px;
                font-size: 11px;
            }

            .section h2 {
                font-size: 16px;
                margin-bottom: 12px;
            }

            .attendance-timeline {
                max-height: 250px;
            }

            .sync-indicator {
                padding: 8px;
                font-size: 11px;
            }

            .center h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            #employeeNameDisplay {
                font-size: 18px !important;
            }

            .status {
                padding: 12px;
                font-size: 13px;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 15px;
            }

            .container {
                width: 100%;
            }

            .card {
                border-radius: 8px;
            }

            .btn-primary, .btn-danger, .btn-logout {
                padding: 11px 15px;
                font-size: 13px;
                margin-bottom: 8px;
            }

            .clock-btn {
                padding: 12px 30px;
                font-size: 15px;
                width: 95%;
                margin: 15px auto;
            }

            .item {
                padding: 10px;
                font-size: 13px;
            }

            .btn-small {
                padding: 5px 8px;
                font-size: 10px;
            }

            .section {
                margin-top: 20px;
            }

            .section h2 {
                font-size: 15px;
                margin-bottom: 10px;
            }

            .form-group label {
                font-size: 13px;
                margin-bottom: 6px;
            }

            .form-group input, .form-group select {
                padding: 9px 10px;
                font-size: 14px;
                border-radius: 6px;
            }

            .center h1 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            #employeeNameDisplay {
                font-size: 16px !important;
                margin-bottom: 30px;
            }

            .sync-indicator {
                padding: 7px;
                font-size: 10px;
                margin-bottom: 12px;
            }

            .status {
                padding: 10px;
                font-size: 12px;
                margin-bottom: 10px;
            }

            .list-empty {
                padding: 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login View -->
        <div id="mainLoginView" class="card">
            <div class="panel center">
                <h1 style="color: #667eea; font-size: 32px; margin-bottom: 40px;">Attendance System</h1>
                <p style="color: #666; margin-bottom: 40px;">Select your role to login</p>
                
                <button class="btn-primary" onclick="goToAdminLogin()" style="margin-bottom: 15px;">🔐 Admin Login</button>
                <button class="btn-primary" onclick="goToEmployeeLogin()" style="background: #764ba2;">👤 Employee Login</button>
            </div>
        </div>

        <!-- Admin Login -->
        <div id="adminLoginView" class="card hidden">
            <div class="panel center">
                <h1 style="color: #667eea; margin-bottom: 40px;">Admin Login</h1>
                
                <div class="form-group" style="max-width: 400px; margin: 0 auto 30px;">
                    <label>Enter Admin Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') loginAsAdmin()">
                </div>

                <button class="btn-primary" onclick="loginAsAdmin()" style="margin-bottom: 10px;">Login</button>
                <button class="btn-danger" onclick="goToMainLogin()">Back</button>
            </div>
        </div>

        <!-- Employee Login -->
        <div id="employeeLoginView" class="card hidden">
            <div class="panel center">
                <h1 style="color: #764ba2; margin-bottom: 40px;">Employee Login</h1>
                
                <div class="form-group" style="max-width: 400px; margin: 0 auto 30px;">
                    <label>Select Your Name</label>
                    <select id="employeeSelect">
                        <option value="">-- Choose an employee --</option>
                    </select>
                </div>

                <button class="btn-primary" onclick="loginAsEmployee()" style="background: #764ba2; margin-bottom: 10px;">Login</button>
                <button class="btn-danger" onclick="goToMainLogin()">Back</button>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminView" class="card hidden">
            <div class="panel">
                <div class="sync-indicator">
                    ✅ Connected to Firebase - Real-time sync enabled
                </div>

                <div class="header">
                    <h1>Admin Dashboard</h1>
                </div>

                <div class="form-group">
                    <label>Add New Employee</label>
                    <input type="text" id="employeeName" placeholder="Enter employee name">
                </div>

                <button class="btn-primary" onclick="addEmployee()">Add Employee</button>
                <button class="btn-logout" onclick="logout()">Logout</button>

                <div class="section">
                    <h2>Employees</h2>
                    <div id="employeeListAdmin"></div>
                </div>

                <div class="section">
                    <h2>Attendance Records (Real-time)</h2>
                    <div id="attendanceListAdmin"></div>
                </div>
            </div>
        </div>

        <!-- Employee Dashboard -->
        <div id="employeeView" class="card hidden">
            <div class="panel center">
                <h1 style="color: #333; margin-bottom: 10px;">Welcome</h1>
                <div style="color: #667eea; font-size: 20px; font-weight: 600; margin-bottom: 40px;" id="employeeNameDisplay"></div>

                <div id="statusMessage" class="status"></div>

                <button class="clock-btn clock-in" onclick="recordAttendance('in')">Clock In</button>
                <button class="clock-btn clock-out" onclick="recordAttendance('out')">Clock Out</button>

                <div class="section">
                    <h2>Your Attendance Today</h2>
                    <div id="myAttendanceList"></div>
                </div>

                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123";

        // ⬇️ REPLACE WITH YOUR FIREBASE CONFIG ⬇️
       const firebaseConfig = {
         apiKey: "AIzaSyATt1qXL4qjC9naPKgP8TwiCUi4AquVO2w",
         authDomain: "attendance-system-5f75c.firebaseapp.com",
         projectId: "attendance-system-5f75c",
         storageBucket: "attendance-system-5f75c.firebasestorage.app",
         messagingSenderId: "668518246439",
         appId: "1:668518246439:web:e4ca2fe881287638ff4602",
         measurementId: "G-CZBTKDD8X2"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            console.log('✅ Firebase initialized');
        } catch (error) {
            console.error('Firebase error:', error);
            alert('Firebase config error. Check console.');
        }

        const db = firebase.firestore();
        let currentEmployee = null;

        function goToMainLogin() {
            document.getElementById('mainLoginView').classList.remove('hidden');
            document.getElementById('adminLoginView').classList.add('hidden');
            document.getElementById('employeeLoginView').classList.add('hidden');
        }

        function goToAdminLogin() {
            document.getElementById('mainLoginView').classList.add('hidden');
            document.getElementById('adminLoginView').classList.remove('hidden');
        }

        function goToEmployeeLogin() {
            document.getElementById('mainLoginView').classList.add('hidden');
            document.getElementById('employeeLoginView').classList.remove('hidden');
            loadEmployees();
        }

        function loginAsAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                listenToEmployees();
                listenToAttendance();
            } else {
                alert('❌ Invalid password');
                document.getElementById('adminPassword').value = '';
            }
        }

        function loginAsEmployee() {
            const selectedId = document.getElementById('employeeSelect').value;
            if (!selectedId) {
                alert('Please select an employee');
                return;
            }

            db.collection('employees').doc(selectedId).get().then(doc => {
                if (doc.exists) {
                    currentEmployee = { id: doc.id, ...doc.data() };
                    sessionStorage.setItem('currentEmployee', JSON.stringify(currentEmployee));
                    document.getElementById('employeeLoginView').classList.add('hidden');
                    document.getElementById('employeeView').classList.remove('hidden');
                    document.getElementById('employeeNameDisplay').textContent = currentEmployee.name;
                    listenToMyAttendance();
                }
            }).catch(error => {
                alert('Error: ' + error.message);
            });
        }

        function addEmployee() {
            const name = document.getElementById('employeeName').value.trim();
            if (!name) {
                alert('Please enter employee name');
                return;
            }

            console.log('Adding employee:', name);

            db.collection('employees').add({
                name: name,
                addedDate: new Date().toLocaleString()
            }).then(docRef => {
                console.log('✅ Employee added:', docRef.id);
                document.getElementById('employeeName').value = '';
                alert('✓ Employee added successfully!');
            }).catch(error => {
                console.error('❌ Error:', error);
                alert('Error: ' + error.message);
            });
        }

        function removeEmployee(id) {
            if (confirm('Remove this employee?')) {
                db.collection('employees').doc(id).delete().catch(error => {
                    alert('Error: ' + error.message);
                });
            }
        }

        function loadEmployees() {
            db.collection('employees').onSnapshot(snapshot => {
                const select = document.getElementById('employeeSelect');
                select.innerHTML = '<option value="">-- Choose an employee --</option>';
                snapshot.forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = doc.data().name;
                    select.appendChild(option);
                });
            }).catch(error => {
                console.error('Error loading employees:', error);
            });
        }

        function listenToEmployees() {
            db.collection('employees').onSnapshot(snapshot => {
                const container = document.getElementById('employeeListAdmin');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="list-empty">No employees</div>';
                    return;
                }

                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <span>${doc.data().name}</span>
                        <button class="btn-small" onclick="removeEmployee('${doc.id}')">Remove</button>
                    `;
                    container.appendChild(div);
                });
            }).catch(error => {
                console.error('Error:', error);
            });
        }

        async function getDeviceInfo() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let ipAddress = 'Unknown';
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipAddress = data.ip;
            } catch (error) {}
            return { ipAddress, deviceType: isMobile ? 'Mobile' : 'Desktop' };
        }

        async function recordAttendance(type) {
            const employee = JSON.parse(sessionStorage.getItem('currentEmployee'));
            const info = await getDeviceInfo();
            const now = new Date();

            db.collection('attendance').add({
                employeeId: employee.id,
                employeeName: employee.name,
                type: type,
                timestamp: now.toLocaleString(),
                time: now.toLocaleTimeString(),
                date: now.toLocaleDateString(),
                device: info.deviceType,
                ipAddress: info.ipAddress,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                const statusMsg = document.getElementById('statusMessage');
                const typeText = type === 'in' ? 'Clock In' : 'Clock Out';
                statusMsg.textContent = `✓ ${typeText} recorded at ${now.toLocaleTimeString()}`;
                statusMsg.classList.add('show');
                
                setTimeout(() => statusMsg.classList.remove('show'), 4000);
                listenToMyAttendance();
            }).catch(error => {
                alert('Error: ' + error.message);
            });
        }

        function listenToMyAttendance() {
            const employee = JSON.parse(sessionStorage.getItem('currentEmployee'));
            const today = new Date().toLocaleDateString();

            db.collection('attendance')
                .where('employeeId', '==', employee.id)
                .where('date', '==', today)
                .onSnapshot(snapshot => {
                    const container = document.getElementById('myAttendanceList');
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="list-empty">No check-ins today</div>';
                        return;
                    }

                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        const record = doc.data();
                        const badge = record.type === 'in' ? '✓ In' : '✗ Out';
                        const color = record.type === 'in' ? '#28a745' : '#dc3545';
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.style.borderLeft = `4px solid ${color}`;
                        div.innerHTML = `
                            <strong style="color: ${color};">${badge}</strong>
                            <span>${record.time}</span>
                        `;
                        container.appendChild(div);
                    });
                }).catch(error => {
                    console.error('Error:', error);
                });
        }

        function listenToAttendance() {
            db.collection('attendance')
                .orderBy('createdAt', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const container = document.getElementById('attendanceListAdmin');
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="list-empty">No records</div>';
                        return;
                    }

                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        const record = doc.data();
                        const typeText = record.type === 'in' ? 'Clock In' : 'Clock Out';
                        const color = record.type === 'in' ? '#28a745' : '#dc3545';
                        const div = document.createElement('div');
                        div.className = 'item';
                        div.style.borderLeft = `4px solid ${color}`;
                        div.style.flexDirection = 'column';
                        div.style.alignItems = 'flex-start';
                        div.innerHTML = `
                            <strong style="color: ${color};">${record.employeeName} - ${typeText}</strong>
                            <small style="color: #999; margin-top: 5px;">${record.time} | ${record.date}</small>
                        `;
                        container.appendChild(div);
                    });
                }).catch(error => {
                    console.error('Error:', error);
                });
        }

        function logout() {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('currentEmployee');
                document.getElementById('mainLoginView').classList.remove('hidden');
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('employeeView').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
